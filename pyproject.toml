[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "islamic-research-hub"
version = "0.1.0"
description = "Foundation for a future Islamic research platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
ai = ["sentence-transformers>=5"]
tts = ["transformers>=5", "torch>=2", "scipy>=1"]
translation = ["transformers>=5", "torch>=2", "sentencepiece>=0.2"]
voice = ["faster-whisper>=1"]
agent = ["anthropic>=0.68", "openai>=2", "google-genai>=2"]
web = ["flask>=3"]
gui = ["PySide6>=6.11", "python-docx>=1.1"]
build = ["pyinstaller>=6.21"]
gui-dev = ["PySide6>=6.11", "pytest-qt>=4.5"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"islamic_research_hub.interfaces" = ["templates/*.html"]
"islamic_research_hub.infrastructure.persistence" = ["scripts/*.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
