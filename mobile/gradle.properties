org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Real fix, confirmed directly: AGP 9.x's built-in Kotlin support
# rejects the `kotlin.sourceSets` DSL by default, but this KSP plugin
# version (2.0.21-era) still registers its generated-code output
# directories through exactly that DSL internally - not a real
# project misconfiguration, a real KSP/AGP version-generation gap.
android.disallowKotlinSourceSets=false
